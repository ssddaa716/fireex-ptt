name: PTT Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          pip install requests beautifulsoup4 -q
          python monitor.py

      - name: Commit seen list
        run: |
          git config user.email "bot@github"
          git config user.name "Monitor Bot"
          git add seen.txt
          git diff --staged --quiet || git commit -m "update seen"
          git push
